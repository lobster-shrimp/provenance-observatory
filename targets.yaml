# Provenance Observatory — monitored targets
#
# Full-transparency posture (see docs/ARCHITECTURE.md and DISCLOSURE.md):
# everything the observatory probes is published in full — the measurements
# AND the interpreted provenance/jurisdiction verdict, together, as collected,
# in an append-only signed log — so consumers can see exactly how each verdict
# was reached. There is no withholding tier and no disclosure-window delay.
# Behavioral (red-teaming) probes remain OFF on every commercial target.
#
# `authorized` still gates whether a target is actively probed at all: a target
# is only reached over the network when authorized=true (and, for commercial
# targets, OBSERVATORY_PROBE_COMMERCIAL=1). `public` no longer gates anything —
# whatever is probed is published in full — and is kept true for all targets.

defaults:
  layers: [tokenizer, wire, latency]   # behavioral deliberately excluded
  behavioral: false
  per_run_probe_cap: 200               # U2 spend guard, per target per run

targets:
  # --- Live controls (real endpoints, own authorized accounts) --------------
  # Positive: a known-CN model that must fingerprint to a CN family.
  # Negative: a known-US model that must NOT be flagged Chinese.
  # Together they are the continuous false-positive/true-positive gate. Keys
  # come from the environment (locally: ~/.zshrc; in CI: Actions secrets).
  - name: control-deepseek-positive
    kind: control-positive
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    api_style: openai
    auth_env: "DEEPSEEK_API_KEY"
    expect_family: "DeepSeek-V3"       # must match a DeepSeek family (CN)
    public: true
    authorized: true                   # own paid account
    session_boundary: true             # P2: also check for an intra-session model swap

  - name: control-openai-negative
    kind: control-negative
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_style: openai
    auth_env: "OPENAI_API_KEY"
    expect_not_origin: "CN"            # must come back NOT-Chinese (FP gate)
    public: true
    authorized: true                   # own paid account
    session_boundary: true             # P2: also check for an intra-session model swap

  # --- Commercial aggregators -----------------------------------------------
  # Commercial targets are only probed when OBSERVATORY_PROBE_COMMERCIAL=1 AND
  # authorized=true. Default runs probe CONTROLS ONLY. Whatever IS probed is
  # published in full (measurements + interpreted verdict).
  - name: openrouter-neutral-endpoint
    kind: aggregator
    base_url: "https://openrouter.ai/api/v1"
    model: "MODEL_ID_TBD"
    api_style: openai
    auth_env: "OPENROUTER_API_KEY"
    public: true
    authorized: false                  # not actively probed until authorized
    notes: "OpenRouter bans red-teaming w/o approval; behavioral stays off."

  - name: together-neutral-endpoint
    kind: aggregator
    base_url: "https://api.together.xyz/v1"
    model: "MODEL_ID_TBD"
    api_style: openai
    auth_env: "TOGETHER_API_KEY"
    public: true
    authorized: false                  # not actively probed until authorized
    notes: "Together ToS explicitly bans benchmarking — probe only if authorized."

  - name: fireworks-neutral-endpoint
    kind: aggregator
    base_url: "https://api.fireworks.ai/inference/v1"
    model: "MODEL_ID_TBD"
    api_style: openai
    auth_env: "FIREWORKS_API_KEY"
    public: true
    authorized: false
    notes: "Neutral aggregator — jurisdiction resolves, provenance open. Watch for CN models."

  - name: deepinfra-neutral-endpoint
    kind: aggregator
    base_url: "https://api.deepinfra.com/v1/openai"
    model: "MODEL_ID_TBD"
    api_style: openai
    auth_env: "DEEPINFRA_API_KEY"
    public: true
    authorized: false
    notes: "Neutral aggregator; hosts many open weights incl. CN families."

  # --- First-party frontier APIs (US) — low-risk negative-monitoring refs ----
  # Verdicts here are non-adverse ("serves a US model"). Useful as
  # always-should-be-US references.
  - name: openai-frontier
    kind: first-party
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_style: openai
    auth_env: "OPENAI_API_KEY"
    public: true
    authorized: true                   # own paid account
    notes: "US reference. Tokenizer o200k is in the reference set (clean fingerprint)."

  - name: anthropic-frontier
    kind: first-party
    base_url: "https://api.anthropic.com/v1"
    chat_path: "/messages"
    model: "claude-opus-4-8"
    api_style: anthropic
    auth_env: "ANTHROPIC_API_KEY"
    public: true
    authorized: true                   # own paid account
    notes: "US reference. Claude tokenizer now in the reference set (live-measured) — expect provenance NO EVIDENCE."

  # --- Known CN-direct endpoints — positive references / the actual mission ---
  # These are the family the observatory exists to track. Whatever is probed is
  # published in full (measurements + interpreted verdict).
  - name: deepseek-direct
    kind: cn-direct
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    api_style: openai
    auth_env: "DEEPSEEK_API_KEY"
    public: true
    authorized: true                   # own paid account
    notes: "PRC-domiciled operator; DeepSeek tokenizer in reference. Expect CONFIRMED CN."

  - name: moonshot-direct
    kind: cn-direct
    base_url: "https://api.moonshot.ai/v1"
    model: "kimi-k2.6"
    api_style: openai
    auth_env: "MOONSHOT_API_KEY"
    public: true
    authorized: true                   # own paid account (api.moonshot.ai)
    notes: "Moonshot AI (Beijing-domiciled) operator via api.moonshot.ai — CDN-fronted, so PRC-operator jurisdiction; Moonshot/Kimi tokenizer in reference."

  # --- Local self-hosted route — provenance-vs-jurisdiction showcase --------
  # A DeepSeek model served through a LOCAL OmniRoute router on 127.0.0.1. The
  # split it demonstrates is the whole point of the harness: provenance is
  # CONFIRMED CN (perfect DeepSeek tokenizer fingerprint) while jurisdiction is
  # UNLIKELY (the endpoint resolves to localhost, not a PRC operator). It is an
  # OpenAI-style endpoint, so it is probed directly (no capture/replay needed).
  #
  # authorized:false ON PURPOSE — 127.0.0.1:20128 only exists on the operator's
  # machine, so the CI nightly can't reach it and must not try (it would write a
  # broken HTTP-0 record). This record is captured on-demand locally; the day's
  # nightly still folds the committed record into the signed manifest (the
  # manifest hashes every record present in data/, probed this run or not).
  - name: omniroute-deepseek-local
    kind: cn-direct
    base_url: "http://localhost:20128/v1"
    model: "oc/deepseek-v4-flash-free"
    api_style: openai
    expect_family: "DeepSeek-V3"       # must fingerprint to a DeepSeek family (CN)
    public: true
    authorized: false                  # local-only endpoint; probed on-demand, never in CI
    notes: "Local OmniRoute route -> DeepSeek. Provenance CONFIRMED CN (tokenizer score 1.0), jurisdiction UNLIKELY (localhost). Captured on-demand locally, not reachable from CI."

  # --- Web-app / platform tool (template adapter) ---------------------------
  # chat.z.ai: a GLM backend that asserts a Google Gemini persona.
  #
  # NIGHTLY SCOPE (what the observatory runs): NEUTRAL drift monitoring only —
  # tokenizer + wire + latency. The deception layer (the persona-mismatch signal)
  # stays OFF here like every commercial target (U1, ToS/abuse risk); run that
  # point-in-time from the engine's local UI/CLI with authorization, not in the
  # public nightly. Web apps usually suppress usage.prompt_tokens, so expect
  # DEGRADED coverage (drift via wire+latency only) — surfaced as such on the site.
  #
  # TO ACTIVATE (all three are operator-provided; do not commit any of them):
  #   1. Capture a real chat request from the browser (DevTools → Network) and
  #      replace request_template + the paths below with the true shape.
  #   2. Provide the session cookie as env ZAI_COOKIE (locally: ~/.zshrc; in CI:
  #      an Actions secret ZAI_COOKIE — set it yourself, never paste it here).
  #   3. Only with written authorization to probe the service, set
  #      authorized: true AND run with OBSERVATORY_PROBE_COMMERCIAL=1.
  # Whatever is probed is published in full (measurements + interpreted
  # verdict); `authorized` alone gates whether it is probed at all.
  - name: chat-z-ai-webapp
    kind: webapp
    base_url: "https://chat.z.ai"
    chat_path: "/api/v2/chat/completions"
    models_path: "/api/v2/models"
    api_style: template
    cookie_env: "ZAI_COOKIE"
    stream_mode: sse
    stream_delta_path: "choices.0.delta.content"
    request_template:
      model: "glm-5.2"
      messages:
        - {role: user, content: "__PROMPT__"}
      stream: true
    response_text_path: "choices.0.message.content"
    response_prompt_tokens_path: "usage.prompt_tokens"
    response_model_path: "model"
    confront_as: "Zhipu GLM"
    public: true
    authorized: false      # PAUSED 2026-08-05: not replay-monitorable (see notes). Operator authorization stands; re-enable if a replayable endpoint appears.
    notes: "PAUSED 2026-08-05 — z.ai moved chat to a SIGNED per-request API (POST /api/v2/chat/completions with per-request timestamp/requestId/signature_timestamp query params). The gateway 404s any request without a valid signature, and a signature can't be precomputed in a static template (nor replayed later from a capture — it is time-bound). So the observatory's static-template replay cannot reach it (the same wall as builder.io/meta.ai). Empirically confirmed: cookie authenticated (no 401) but the bare path 404s. Last observed served model: GLM-5.2 (up from GLM-4.6) as of 2026-08-05 — itself the kind of switch this monitor exists to catch. Re-activating would require a z.ai-specific request-signing adapter (a separate, fragile effort). Kept configured (v2 path + SSE) so re-enabling is one flag flip if that ships. cookie_env ZAI_COOKIE unused while paused."

  # --- Requested AI web apps / agent platforms (watch list) -----------------
  # Added to the watch list per request. These are third-party authenticated web
  # apps, NOT owned accounts, so they are NOT probed here: each needs (1) written
  # authorization to probe, (2) a real chat request captured from the browser
  # (DevTools → Network) to fill chat_path + request_template + response paths,
  # and (3) the session cookie in the named env var. Until all three exist they
  # stay authorized:false and are skipped. The tokenizer fingerprint only works
  # if the app exposes usage.prompt_tokens; many web apps suppress it, in which
  # case coverage degrades to wire+latency+behavioral (see adding-sources.md).
  - name: lindy-chat-webapp
    kind: webapp
    base_url: "https://chat.lindy.ai"
    chat_path: "CAPTURE_TBD"           # capture from DevTools → Network
    api_style: template
    cookie_env: "LINDY_COOKIE"
    request_template: {}               # fill from a captured request
    response_text_path: ""
    response_prompt_tokens_path: ""
    response_model_path: ""
    public: true
    authorized: false                  # third-party; needs written auth + capture + cookie
    notes: "Lindy AI agent platform. Assessable IF it exposes an LLM chat call with usage; needs a captured request + LINDY_COOKIE before probing."

  - name: replit-agent-webapp
    kind: webapp
    base_url: "https://replit.com"
    chat_path: "CAPTURE_TBD"
    api_style: template
    cookie_env: "REPLIT_COOKIE"
    request_template: {}
    response_text_path: ""
    response_prompt_tokens_path: ""
    response_model_path: ""
    public: true
    authorized: false
    notes: "Replit AI / Agent. LLM-backed; needs a captured Agent request + REPLIT_COOKIE. Expect degraded coverage if usage is suppressed."

  - name: base44-webapp
    kind: webapp
    base_url: "https://base44.com"
    chat_path: "CAPTURE_TBD"
    api_style: template
    cookie_env: "BASE44_COOKIE"
    request_template: {}
    response_text_path: ""
    response_prompt_tokens_path: ""
    response_model_path: ""
    public: true
    authorized: false
    notes: "Base44 AI app builder. LLM-backed; needs a captured request + BASE44_COOKIE before probing."

  # Requested but OUT OF SCOPE for this method (no LLM text / prompt-token
  # surface to fingerprint): ElevenLabs (voice/TTS) and Runway (video gen). This
  # provenance method fingerprints an LLM text endpoint via tokenizer/wire/
  # latency; it does not apply to audio/video models. If either ships an LLM
  # chat/agent surface, add it as a webapp target above once a request is captured.

  # --- Continuous agent monitoring (E2/E3) --------------------------------
  # A target with an `agent_trace` is assessed nightly by the engine's agent
  # flight recorder (runner/agent_monitor.py), not the endpoint `assess` path.
  # The engine runs `agent-trace <agent_trace> --export`, drops the signed-ready
  # record under data/agents/<name>/<date>/, and drifts the agent fingerprint;
  # a composition change opens a numbered MPA agent advisory. Provide a captured
  # OTel-GenAI / minimal-JSON trace of the authorized agent run.
  # - name: acme-copilot
  #   agent_trace: traces/acme-copilot/latest.json
  #   public: true         # full transparency: published in full when probed
  #   authorized: false    # flip only with written authorization

# Monthly spend ceiling across all targets (U2). Runner aborts to a
# no-verdict{budget-exceeded} artifact if a run would breach it.
budget:
  monthly_ceiling_usd: 50
