name: link-check

# ⚠️ SOFT GATE ONLY — do NOT make `internal links + anchors (offline)` a REQUIRED
# status check on this repo's `main`. The nightly runner (observatory.yml) commits
# `data/` and pushes DIRECTLY to `main` with GITHUB_TOKEN; a required status check
# rejects that push (`GH006: Protected branch update failed … Required status check
# "internal links + anchors (offline)" is expected`), which breaks the nightly.
# (The probe repo IS hard-gated — it has no direct-push bot; all changes land via PR.)
# Verified 2026-08-17: requiring the check here failed the nightly's push; reverted.
#
# Audit repo docs for broken links (relative files, in-page/cross-file anchors,
# external URLs). Split so the PR gate is deterministic:
#   - internal: OFFLINE — local files + anchor fragments only. No network, never
#     flaky. This is the gate that runs on every docs PR/push.
#   - external: online URL reachability, LENIENT + scheduled/on-demand only, so a
#     transient 5xx / rate-limit never red-flags an unrelated PR.
on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/link-check.yml"]
  pull_request: {}          # every PR (not path-filtered) so the required status
                            # check always reports — else non-docs PRs get stuck
                            # "Expected". The offline internal job is fast (~seconds).
  schedule:
    - cron: "0 6 * * 1"          # Mondays — catch external link rot
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  internal:
    name: internal links + anchors (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard emoji-heading anchors
        # lychee can't catch these: GitHub keeps the U+FE0F variation selector in an
        # emoji heading's anchor, lychee drops it — so a link to an emoji-heading
        # auto-anchor breaks on GitHub yet false-passes lychee. Require an explicit
        # <a id> instead (resolves identically on both). See the script's guidance.
        run: python3 scripts/check-emoji-anchors.py
      - name: lychee (offline — files + fragments)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --include-fragments --no-progress '**/*.md'"
          fail: true

  external:
    name: external URLs (scheduled / on-demand, lenient)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee (online — external reachability)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--include-fragments --no-progress --max-retries 3 --accept 200..=299,403,429 --exclude-loopback '**/*.md'"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # avoid GitHub API rate limits on gh.com links
