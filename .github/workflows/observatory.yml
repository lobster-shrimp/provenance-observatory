name: observatory

# Security posture (design decision, Arch review): this workflow holds real
# credentials (aggregator API keys + a staging-repo PAT), so it triggers ONLY
# on schedule and manual dispatch — never pull_request / pull_request_target,
# which would expose secrets to fork code. Secrets are environment-scoped;
# require review on changes to this file.
on:
  schedule:
    - cron: "17 3 * * *"    # nightly; a second entry can hedge cron flakiness
  workflow_dispatch: {}

# Serialize runs so the redundant cron + manual dispatch can't double-commit
# or race on push. Queue, don't cancel — a half-finished run should complete.
concurrency:
  group: observatory-nightly
  cancel-in-progress: false

permissions:
  contents: write          # commit data/ to this (public) repo
  # NOTE: default GITHUB_TOKEN CANNOT write the private staging repo. Provide
  # STAGING_PAT (fine-grained, staging repo only) + OBSERVATORY_STAGING_REPO
  # (the private repo https URL) as secrets/vars. lib/staging_sync.py then clones
  # the persisted drift state (baseline/state/drafts/MPA counter) at job start and
  # pushes it back at job end — making silent-swap detection actually persist.
  # Absent either → local-only fallback (drift persistence off), no network.

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: observatory          # environment-scoped secrets live here
    permissions:
      contents: write                 # commit data/
      id-token: write                 # cosign keyless OIDC identity
      issues: write                   # open a model-switch alert issue on drift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned probe + deps (reproducible)
        # Pinned PyPI install (requirements.txt: llm-provenance-probe==<version> +
        # pyyaml) instead of git@main — a reproducible, non-moving build. Bump the
        # pin in requirements.txt to adopt a new probe release. (The eval-harness
        # scripts still clone source: eval/ is not packaged in the wheel.)
        run: pip install -r requirements.txt
      - uses: sigstore/cosign-installer@v3   # cosign for keyless evidence signing
      - name: Run nightly probes (builds + signs the day's manifest)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}   # live CN positive control + deepseek-direct
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}       # live US negative control + openai-frontier
          # targets.yaml auth_env for the frontier/direct vendor targets. These were
          # missing until 2026-09-16: anthropic-frontier and moonshot-direct 401'd on
          # every probe from 2026-08-04 and the runner published the 401s as verdicts.
          # Add both as environment secrets; the runner now records a no-verdict
          # ("auth failed") instead of a verdict when a key is absent or stale.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # anthropic-frontier
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}   # moonshot-direct (api.moonshot.ai)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          ZAI_COOKIE: ${{ secrets.ZAI_COOKIE }}   # chat.z.ai web-app session. UNUSED while chat-z-ai-webapp is authorized:false (PAUSED 2026-08-05, see targets.yaml notes); kept so re-enabling is one flag flip.
          STAGING_PAT: ${{ secrets.STAGING_PAT }}   # fine-grained PAT, private staging repo ONLY (least-privilege)
          OBSERVATORY_STAGING_REPO: ${{ vars.OBSERVATORY_STAGING_REPO }}   # https URL of the private staging repo
          # Dry-run gate (issue #50): DRAFT-only until an operator flips this to "1"
          # after a dry-run week confirms the UNSTABLE damper swallows CDN/gateway
          # wire noise. Default OFF so a merged-but-imperfect run can never emit a
          # false PUBLIC advisory. Absent/"0" = drafts only, no numbered MPA, no issue.
          OBSERVATORY_ADVISORY_LIVE: ${{ vars.OBSERVATORY_ADVISORY_LIVE }}
          COSIGN_YES: "true"
          OBSERVATORY_PROBE_COMMERCIAL: "1"   # probe authorized commercial/web-app targets (z.ai). Controls run regardless.
        # run.py also regenerates + signs the public catalogs from the pinned probe CLI:
        #   - the MODEL catalog    (build_catalog.build_signed_catalog -> data/catalog/)
        #   - the SERVICE catalog  (build_service_catalog.build_signed_service_catalog
        #                           -> data/service-catalog/)
        # Both are GUARDED/best-effort: if the pinned probe predates the CLI subcommand
        # (`build-service-catalog` is not on a PyPI release yet), it's a clean no-op and
        # the committed seed is published as-is — the run never fails on it. Bump the
        # requirements.txt probe pin to start regenerating the service catalog.
        run: python runner/run.py --targets targets.yaml
      - name: Ingest session transcripts (mid-session model-switch detection)
        run: python runner/ingest_transcripts.py --data data --public control-deepseek-positive,control-openai-negative
      - name: Refresh engine eval summary (assurance badge auto-tracks the engine)
        run: bash scripts/refresh-engine-eval.sh
      - name: Alert on model switch (fast alerting)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A served-model switch on a monitored target promotes a new advisory
          # record (runner/advisory.py, immediate under full-transparency). Detect
          # any new/changed advisory this run and open a GitHub issue so the
          # operator is notified fast (nightly cadence, loud on switch). Never
          # fails the run.
          CHANGED=$(git status --porcelain data/advisories/ 2>/dev/null | awk '{print $2}')
          if [ -n "$CHANGED" ]; then
            {
              echo "## ⚠️ Model switch detected — $(date -u +%F)"
              echo ""
              echo "A monitored target changed its served-model fingerprint. New/updated advisory record(s):"
              echo ""
              for f in $CHANGED; do echo "- \`$f\`"; done
              echo ""
              echo "Public log: https://lobster-shrimp.github.io/provenance-observatory/"
            } > /tmp/switch-alert.md
            cat /tmp/switch-alert.md >> "$GITHUB_STEP_SUMMARY" || true
            echo "::warning title=Model switch detected::$(echo $CHANGED | tr '\n' ' ')"
            gh label create model-switch --color B60205 \
              --description "Automated: a monitored target's served model changed" 2>/dev/null || true
            gh issue create --title "⚠️ Model switch detected $(date -u +%F)" \
              --body-file /tmp/switch-alert.md --label model-switch 2>&1 \
              || gh issue create --title "⚠️ Model switch detected $(date -u +%F)" --body-file /tmp/switch-alert.md 2>&1 \
              || echo "issue create failed (non-fatal)"
          else
            echo "No model-switch advisory this run." >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Commit neutral evidence + signed manifest
        id: commit
        run: |
          git config user.name "observatory-bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: nightly probe $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Redeploy the live Cloud Run API with the fresh data. The commit above pushes
      # with GITHUB_TOKEN, which by GitHub's anti-recursion rule does NOT trigger
      # deploy-api.yml — so the nightly redeploys DIRECTLY (keyless WIF), only when
      # data actually changed. deploy-api.yml still covers human/merge pushes.
      - name: Auth to GCP (Workload Identity Federation)
        if: steps.commit.outputs.changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/513338163479/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "obs-api-deployer@gen-lang-client-0992245391.iam.gserviceaccount.com"
      - name: Set up gcloud
        if: steps.commit.outputs.changed == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Redeploy the live API with the fresh data
        if: steps.commit.outputs.changed == 'true'
        run: |
          gcloud run deploy provenance-observatory-api --source . \
            --project gen-lang-client-0992245391 --region us-central1 \
            --allow-unauthenticated --quiet

  # Render the Variant C site from data/ and DEPLOY it to GitHub Pages.
  # Full-transparency posture: the site publishes measurements AND interpreted
  # verdicts as collected. (Requires GitHub Pages enabled with source =
  # "GitHub Actions" in repo Settings → Pages.)
  site:
    needs: probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write            # publish to GitHub Pages
      id-token: write         # OIDC for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render site
        # Point the site's "API" link / SSE at the live Cloud Run API (else it
        # defaults to the raw data/ tree on GitHub).
        env:
          OBSERVATORY_API_URL: "https://provenance-observatory-api-513338163479.us-central1.run.app/api/docs"
        run: |
          pip install pyyaml
          python site/build.py --data data --out site/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
